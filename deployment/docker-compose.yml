name: wrenchless

services:
  gateway:
    build:
      context: ..
      target: gateway
      args:
        VITE_SITE_URL: ${WRENCHLESS_PUBLIC_ORIGIN:?set WRENCHLESS_PUBLIC_ORIGIN}
        VITE_SPONSOR_URL: ${WRENCHLESS_PUBLIC_ORIGIN:?set WRENCHLESS_PUBLIC_ORIGIN}/api/sponsor
        VITE_WALLETCONNECT_PROJECT_ID: ${WRENCHLESS_WALLETCONNECT_PROJECT_ID:?set WRENCHLESS_WALLETCONNECT_PROJECT_ID}
    restart: unless-stopped
    depends_on:
      sponsor:
        condition: service_started
    networks:
      private:
      public_proxy:
        aliases:
          - wrenchless-gateway
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

  sponsor:
    build:
      context: ..
      target: services
    command: ["pnpm", "--filter", "@wrenchless/sponsor", "start"]
    restart: unless-stopped
    environment:
      WRENCHLESS_SPONSOR_ENV: /run/secrets/sponsor.env
    volumes:
      - type: bind
        source: ${WRENCHLESS_SPONSOR_ENV_FILE:?set WRENCHLESS_SPONSOR_ENV_FILE}
        target: /run/secrets/sponsor.env
        read_only: true
      - sponsor_data:/data
    networks:
      - private
      - sponsor_egress
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8788/healthz',{headers:{'x-forwarded-proto':'https'}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  sponsor_data:

networks:
  private:
    internal: true
  sponsor_egress:
  public_proxy:
    external: true
